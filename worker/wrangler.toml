name = "pe-analyser"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Every 15 minutes: fetch whatever is missing or stale (within the AV call budget), then rebuild the snapshot.
[triggers]
crons = ["*/15 * * * *"]

# Create with:  npx wrangler kv namespace create PE_KV   and paste the id below.
[[kv_namespaces]]
binding = "PE_KV"
id = 825c503d04674d218c389ee2d2c74933

[limits]
cpu_ms = 60000   # Workers Paid plan; ignored on Free

[vars]
# Comma-separated list of browser origins allowed to call the API, e.g. "https://alanmurray180.github.io"
ALLOWED_ORIGINS = "https://alanmurray180.github.io"
# Alpha Vantage paid tier controls
AV_CALLS_PER_RUN = "60"      # max AV calls per cron run
AV_CALLS_PER_MIN = "70"      # throttle to stay inside your AV per-minute limit
AV_ENTITLEMENT = "realtime"  # "realtime", "delayed" or "" depending on your AV plan
# Quote routing: tried in order until every symbol has a price
QUOTE_PROVIDERS = "av_bulk,fmp_batch,fmp,av"
QUOTE_TTL_SECONDS = "15"
# Data freshness
FUND_TTL_HOURS = "24"
HIST_TTL_HOURS = "12"
ETF_TTL_DAYS = "7"
ETF_TOP_N = "50"             # holdings used for ETF look-through earnings
HIST_START = "2019-01-01"    # earliest price history kept (extends automatically for older event dates)
